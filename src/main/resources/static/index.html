<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device=width,initial-scale=1" name="viewport"/>
    <meta content="width=device-width,intial-scale=1" name="viewport"/>
    <title>
        Calculus Test Generator
    </title>
    <style>
        :root{
            --sky:#d8f0ff;
            --pale:#f2faff;
            --blue:#2189c5;
            --deep:#194c6c;
            --text:#253f51;
            --muted:#638093;
            --line:#d5e8f3;
            --white:#fff;
        }
        *{
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height:1.6;
            background: #f5fbff;
            color:var(--text);
        }
        button,input,select {
            font: inherit;
        }
        button{
            cursor: pointer;
        }
        .topbar{
            background:#e1f3ff;
            border-bottom: 1px solid #c9e6f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px max(25px, calc((100vw - 1180px)/2));
            gap: 20px;
        }
        .logo{
            display: flex;
            align-items: center;
            width: 49px;
            height: 49px;
            border-radius: 14px;
            background: #b9e4fc;
            font-size: 33px;
            font-weight: bold;
        }
        .logo strong{
            display: block;
            font-size: 21px;
            line-height: 1.25;
        }
        .logo small{
            display: block;
            font-size: 12px;
            letter-spacing: 04em;
            color: var(--muted);
            margin-top: 4px;
        }
        .header-tag{
            background: white;
            border: 1px solid #c9e5f5;
            border-radius: 25px;
            padding: 8px 15px;
            font-size: 12px;
            color: var(--deep);
            font-weight: bold;
        }
        main{
            max-width: 1220px;
            margin: auto;
            padding: 30px 22px;
        }
        .welcome{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 37px 42px;
            background: linear-gradient(115deg,#d3edff,#eff9ff);
            border: 1px solid #c9e6f6;
            border-radius: 20px;
            margin-bottom: 27px;
        }
    </style>
</head>
</html>
